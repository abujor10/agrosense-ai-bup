<script>
    async function analyzeCropData() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const promptText = document.getElementById('cropIssue').value.trim();
      const btn = document.getElementById('submitBtn');
      const outputCard = document.getElementById('outputCard');

      if (!apiKey || !promptText) {
        alert("দয়া করে API Key এবং সমস্যার বিবরণ দিন।");
        return;
      }

      btn.disabled = true;
      btn.innerText = "বিশ্লেষণ করা হচ্ছে...";

      const prompt = `You are an expert Agro AI in Bangladesh. Analyze this crop issue or price query: "${promptText}".
Output ONLY valid raw JSON (no backticks, no markdown) like this:
{
  "urgency": "Normal",
  "diagnosis": "কারণ ও রোগ বাংলায়",
  "treatments": ["পদক্ষেপ ১", "পদক্ষেপ ২"],
  "marketAnalysis": "বাজার দর বিশ্লেষণ বাংলায়"
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message);
        }

        let text = data.candidates[0].content.parts[0].text;
        text = text.replace(/```json/g, "").replace(/```/g, "").trim();
        const result = JSON.parse(text);

        document.getElementById('diseaseDiagnosis').innerText = result.diagnosis;
        document.getElementById('marketAdvice').innerText = result.marketAnalysis;

        const list = document.getElementById('treatmentList');
        list.innerHTML = "";
        result.treatments.forEach(t => {
          const li = document.createElement('li');
          li.innerText = t;
          list.appendChild(li);
        });

        const badge = document.getElementById('urgencyBadge');
        badge.innerText = result.urgency;
        badge.className = "text-xs px-3 py-1 rounded-full font-semibold " + 
          (result.urgency === 'Critical' ? 'bg-red-100 text-red-800' : 'bg-emerald-100 text-emerald-800');

        outputCard.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        alert("আসল সমস্যা: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "পরামর্শ বিশ্লেষণ করুন";
      }
    }
  </script>
