<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroSense AI - কৃষি পরামর্শ ও বাজার দর</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen">

  <!-- Header -->
  <header class="border-b border-stone-200 bg-white/80 backdrop-blur sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🌱</span>
        <span class="font-bold text-xl text-emerald-800">AgroSense AI</span>
      </div>
      <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium">BUP Hackathon Prototype</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-10">
    <!-- Input Card -->
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-stone-200 mb-8">
      <h2 class="text-lg font-bold text-stone-900 mb-2">ফসলের সমস্যা বা বাজার দর লিখুন</h2>
      <p class="text-sm text-stone-500 mb-4">লক্ষণ, ফসলের নাম বা ফড়িয়াদের প্রস্তাবিত পাইকারি দর বিস্তারিত লিখুন।</p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">আপনার API Key (Gemini)</label>
          <input id="apiKey" type="password" placeholder="AI Studio থেকে পাওয়া Gemini API Key দিন" 
                 class="w-full text-sm p-3 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-emerald-600">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">সমস্যার বিবরণ</label>
          <textarea id="cropIssue" rows="4" placeholder="উদাহরণ: টমেটো গাছের পাতা হলুদ হয়ে পোকা উড়ছে..."
                    class="w-full text-sm p-3 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-emerald-600"></textarea>
        </div>

        <button onclick="analyzeCropData()" id="submitBtn" 
                class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-sm flex justify-center items-center gap-2">
          <span>পরামর্শ বিশ্লেষণ করুন</span>
        </button>
      </div>
    </div>

    <!-- Output Card -->
    <div id="outputCard" class="hidden bg-white rounded-2xl p-6 shadow-sm border border-stone-200">
      <div class="flex items-center justify-between mb-4 border-b border-stone-100 pb-3">
        <h3 class="font-bold text-lg text-stone-900">AI বিশ্লেষণ ফলাফল</h3>
        <span id="urgencyBadge" class="text-xs px-3 py-1 rounded-full font-semibold"></span>
      </div>

      <div class="space-y-4 text-sm">
        <div>
          <h4 class="font-semibold text-stone-700">সম্ভাব্য কারণ ও রোগ নির্ণয়:</h4>
          <p id="diseaseDiagnosis" class="text-stone-600 mt-1"></p>
        </div>

        <div>
          <h4 class="font-semibold text-stone-700">প্রস্তাবিত সমাধান ও চিকিৎসা:</h4>
          <ul id="treatmentList" class="list-disc pl-5 text-stone-600 mt-1 space-y-1"></ul>
        </div>

        <div class="bg-amber-50 border border-amber-200 rounded-xl p-4">
          <h4 class="font-semibold text-amber-900">বাজার দর ও সতর্কতা:</h4>
          <p id="marketAdvice" class="text-amber-800 mt-1"></p>
        </div>
      </div>
    </div>
  </main>

  <script>
    async function analyzeCropData() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const promptText = document.getElementById('cropIssue').value.trim();
      const btn = document.getElementById('submitBtn');
      const outputCard = document.getElementById('outputCard');

      if (!apiKey || !promptText) {
        alert("দয়া করে API Key এবং সমস্যার বিবরণ প্রদান করুন।");
        return;
      }

      btn.disabled = true;
      btn.innerText = "বিশ্লেষণ করা হচ্ছে...";

      const systemInstruction = `You are an expert Agronomist and Agricultural Market Analyst in Bangladesh.
Analyze the user's agricultural problem or market price inquiry.
Always return ONLY a valid JSON object without markdown formatting, matching this exact schema:
{
  "urgency": "Normal" | "Moderate" | "Critical",
  "diagnosis": "Detailed root cause in plain Bangla",
  "treatments": ["Actionable step 1 in Bangla", "Actionable step 2 in Bangla"],
  "marketAnalysis": "Price or protective evaluation in Bangla"
}`;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

        const payload = {
          contents: [
            {
              role: "user",
              parts: [{ text: `${systemInstruction}\n\nFarmer Query: ${promptText}` }]
            }
          ]
        };

        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message || "API Request Failed");
        }

        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
        const result = JSON.parse(rawText);

        document.getElementById('diseaseDiagnosis').innerText = result.diagnosis;
        document.getElementById('marketAdvice').innerText = result.marketAnalysis;
        
        const list = document.getElementById('treatmentList');
        list.innerHTML = "";
        result.treatments.forEach(t => {
          const li = document.createElement('li');
          li.innerText = t;
          list.appendChild(li);
        });

        const badge = document.getElementById('urgencyBadge');
        badge.innerText = result.urgency;
        if (result.urgency === 'Critical') {
          badge.className = "text-xs px-3 py-1 rounded-full font-semibold bg-red-100 text-red-800";
        } else if (result.urgency === 'Moderate') {
          badge.className = "text-xs px-3 py-1 rounded-full font-semibold bg-amber-100 text-amber-800";
        } else {
          badge.className = "text-xs px-3 py-1 rounded-full font-semibold bg-emerald-100 text-emerald-800";
        }

        outputCard.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        alert("সমস্যার কারণ: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "পরামর্শ বিশ্লেষণ করুন";
      }
    }
  </script>
</body>
</html>
